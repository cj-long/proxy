<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relay</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="landing">
      <p class="eyebrow">PLAYWRIGHT BROWSER RELAY</p>
      <h1>Open a website<br><em>in a real browser.</em></h1>
      <p class="intro">
        Relay runs a Chromium browser session and streams its viewport to this page.
      </p>

      <form id="proxy-form">
        <label for="url">Website address</label>
        <div class="url-row">
          <input
            id="url"
            type="url"
            placeholder="https://example.com"
            autocomplete="url"
            required
          >
          <button type="submit">Open</button>
        </div>
        <p id="error" role="alert"></p>
      </form>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
